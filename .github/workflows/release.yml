name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag (v<package version>)
        required: true
        type: string
      commit:
        description: Full reviewed release commit SHA
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate event identity before checkout
        id: event
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REVIEWED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          case "$GITHUB_EVENT_NAME" in
            release) ;;
            workflow_dispatch) [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]] ;;
            *) exit 1 ;;
          esac
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.event.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Bind tag, commit, manifest and changelog
        id: source
        env:
          RELEASE_TAG: ${{ steps.event.outputs.tag }}
          REVIEWED_COMMIT: ${{ inputs.commit }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/release-source.mjs
      - run: npm install --global npm@11.5.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Review pack inventory
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          cat "$RUNNER_TEMP/pack.json"
          node --input-type=module - "$RUNNER_TEMP/pack.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const [pack] = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const expected = new Set([
            'LICENSE', 'README.md', 'package.json', 'path-permissions.example.json',
            'extensions/path-permissions.ts', 'extensions/tool-output-redactor.ts',
            'extensions/shared/path-matching.ts', 'extensions/shared/path-permissions.ts',
            'extensions/shared/redaction.ts',
          ]);
          if (pack.name !== pkg.name || pack.version !== pkg.version || pack.files.length !== expected.size ||
              pack.files.some(file => !expected.delete(file.path)) || expected.size) {
            throw new Error('Unexpected packed identity or files');
          }
          NODE
          test -z "$(git status --porcelain)"
      - name: Reconcile registry identity before publish or retry
        id: registry
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: node scripts/release-identity.mjs preflight
      - name: Publish missing immutable version
        if: steps.registry.outputs.published != 'true'
        run: npm publish --access public --provenance
      - name: Verify published version and gitHead (also on matching retries)
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: node scripts/release-identity.mjs postpublish
